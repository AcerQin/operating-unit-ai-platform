<html lang="zh-CN">

    main{min-width:0}.topbar{height:72px;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:4}.crumb{font-weight:700}.top-actions{display:flex;align-items:center;gap:10px}.top-actions button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;color:#5a6478}
    .content{padding:26px;max-width:1600px;margin:auto}.page{display:none;animation:fade .2s ease}.page.active{display:block}@keyframes fade{from{opacity:.5;transform:translateY(4px)}}

    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:18px 0}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.stat{padding:20px;display:flex;align-items:center;gap:15px}.stat-icon{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:21px}.stat b{font-size:25px;display:block}.stat span{color:var(--muted);font-size:13px}
    .grid-2{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}.card{padding:20px}.card-head,.page-head,.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px}.card h3,.page-head h1{margin:0}.page-head{margin-bottom:20px}.page-head p{margin:6px 0 0;color:var(--muted)}.actions{display:flex;gap:9px;flex-wrap:wrap}
    .btn{border:1px solid var(--line);background:#fff;padding:9px 14px;border-radius:10px;color:#536078}.btn:hover{border-color:#b9c2ec;color:var(--brand)}.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.btn.danger{color:var(--red)}.btn.sm{padding:6px 10px;font-size:12px}
    .progress-row{margin:20px 0}.progress-meta{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px}.progress{height:8px;border-radius:99px;background:#edf0f6;overflow:hidden}.progress i{display:block;height:100%;border-radius:inherit}
    .timeline{list-style:none;padding:0;margin:14px 0 0}.timeline li{position:relative;padding:0 0 18px 24px;border-left:2px solid #e7eaf4;margin-left:5px}.timeline li:before{content:"";position:absolute;left:-6px;top:2px;width:10px;height:10px;border-radius:50%;background:var(--green)}.timeline small{display:block;color:var(--muted);margin-top:4px}
    .toolbar{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}.filters{display:flex;gap:10px;flex-wrap:wrap}.input,.select{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 11px;outline:0;min-width:170px}.input:focus,.select:focus{border-color:var(--brand)}
    .table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:15px}.data-table{width:100%;border-collapse:collapse;min-width:850px}.data-table th{font-size:12px;color:#778199;background:#fafbfe;text-align:left;padding:13px 16px;border-bottom:1px solid var(--line)}.data-table td{padding:14px 16px;border-bottom:1px solid #f0f2f6;font-size:13px}.data-table tr:last-child td{border-bottom:0}.data-table tbody tr:hover{background:#fafbff}.badge{display:inline-flex;align-items:center;padding:4px 9px;border-radius:99px;background:#eaf8f3;color:#168665;font-size:12px}.badge.blue{background:#edf1ff;color:var(--brand)}.badge.orange{background:#fff3e5;color:#c87518}.badge.gray{background:#eef0f4;color:#697287}
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.entity{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);transition:.2s}.entity:hover{transform:translateY(-2px);border-color:#cdd4f3}.entity-head{display:flex;align-items:start;justify-content:space-between;gap:10px}.entity h3{font-size:16px;margin:0}.entity p{color:var(--muted);font-size:13px;min-height:38px}.meta{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:14px;color:var(--muted);font-size:12px}
    .cockpit-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 13px;color:#626c81}.chip.active{background:#edf1ff;color:var(--brand);border-color:#cfd7ff}.cockpit{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.dash{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}.dash-preview{height:190px;padding:22px;color:#fff;background:linear-gradient(140deg,#243a94,#4d67da);position:relative}.dash-preview.green{background:linear-gradient(140deg,#087c69,#28b69a)}.dash-preview.purple{background:linear-gradient(140deg,#46308f,#8367e8)}.dash-preview.orange{background:linear-gradient(140deg,#b96817,#f2a444)}.mini-bars{display:flex;align-items:end;gap:11px;height:95px;margin-top:12px}.mini-bars i{flex:1;border-radius:5px 5px 0 0;background:rgba(255,255,255,.76)}.dash-foot{padding:15px 18px;display:flex;justify-content:space-between;align-items:center}
    .flow{display:flex;align-items:center;gap:10px}.node{padding:9px 12px;border-radius:10px;background:#eef1ff;color:var(--brand);font-size:12px}.arrow{color:#a3abc0}.empty{padding:60px;text-align:center;color:var(--muted)}.modal{position:fixed;inset:0;background:rgba(13,21,43,.48);display:none;place-items:center;z-index:20}.modal.open{display:grid}.dialog{background:#fff;border-radius:18px;width:min(520px,92vw);padding:24px;box-shadow:0 24px 70px rgba(12,22,50,.25)}.dialog h2{margin-top:0}.form-grid{display:grid;gap:13px}.form-grid label{font-size:13px;color:#626c81}.form-grid input,.form-grid select,.form-grid textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;margin-top:6px}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.toast{position:fixed;right:25px;bottom:25px;background:#172033;color:#fff;padding:12px 18px;border-radius:10px;box-shadow:var(--shadow);opacity:0;transform:translateY(12px);transition:.2s;z-index:30}.toast.show{opacity:1;transform:none}
    .feature-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 0 18px}.feature{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.feature b{display:block;font-size:13px}.feature small{display:block;color:var(--muted);margin-top:5px;line-height:1.5}.feature .fi{font-size:20px;margin-bottom:9px}
    .workspace{display:grid;grid-template-columns:240px 1fr;background:#fff;border:1px solid var(--line);border-radius:16px;min-height:520px;overflow:hidden;box-shadow:var(--shadow)}.workspace-side{border-right:1px solid var(--line);padding:14px;background:#fbfcff}.side-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.file-item{padding:10px;border-radius:10px;margin:4px 0;font-size:13px;display:flex;justify-content:space-between}.file-item:hover,.file-item.active{background:#eaf0ff;color:var(--brand)}.workspace-main{min-width:0}.sheet-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.sheet-tools{display:flex;gap:7px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);background:#fcfdff}.sheet-tools button{border:0;background:transparent;color:#5d677c;padding:7px 9px;border-radius:8px}.sheet-tools button:hover{background:#eef2ff;color:var(--brand)}.sheet-status{padding:9px 16px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
    .field-type-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.field-type{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fafbff;text-align:center;font-size:12px}.field-type:hover{border-color:var(--brand);color:var(--brand)}.configured-fields{display:grid;gap:8px;margin-top:15px}.configured-field{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);padding:10px;border-radius:10px}.configured-field span{font-size:12px;color:var(--muted)}
    .form-section{padding:15px;border:1px solid var(--line);border-radius:13px;background:#fcfdff;margin:10px 0}.form-section h4{margin:0 0 13px}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.switch-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}.switch-row:last-child{border-bottom:0}.toggle{width:42px;height:23px;border-radius:99px;background:#dce1eb;position:relative}.toggle:after{content:"";width:17px;height:17px;border-radius:50%;background:#fff;position:absolute;left:3px;top:3px;box-shadow:0 2px 6px #8d96a8}.toggle.on{background:var(--brand)}.toggle.on:after{left:22px}
    .pipeline{display:flex;align-items:center;gap:6px}.pipeline span{font-size:11px;padding:5px 8px;border-radius:99px;background:#edf1ff;color:var(--brand)}.pipeline i{color:#adb5c5}.dropzone{border:2px dashed #cbd3e5;border-radius:14px;padding:28px;text-align:center;color:var(--muted);background:#fafbff}.dropzone b{display:block;color:var(--ink);margin-bottom:5px}
    .chat-layout{display:grid;grid-template-columns:280px 1fr;background:#fff;border:1px solid var(--line);border-radius:16px;min-height:570px;overflow:hidden;box-shadow:var(--shadow)}.chat-side{border-right:1px solid var(--line);padding:13px;background:#fbfcff}.session{padding:12px;border-radius:11px;margin:5px 0}.session.active,.session:hover{background:#edf1ff}.session b{display:block;font-size:13px}.session small{color:var(--muted)}.chat-main{display:grid;grid-template-rows:auto 1fr auto;min-width:0}.chat-header{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.messages{padding:20px;overflow:auto;background:linear-gradient(#fff,#fbfcff)}.bubble{max-width:76%;padding:13px 15px;border-radius:15px;margin:10px 0;line-height:1.65;font-size:13px}.bubble.user{margin-left:auto;background:var(--brand);color:#fff;border-bottom-right-radius:4px}.bubble.ai{background:#f0f3fa;border-bottom-left-radius:4px}.sources{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.source{padding:4px 7px;border:1px solid #ccd4ec;border-radius:6px;color:var(--brand);font-size:11px}.composer{display:flex;gap:9px;padding:14px;border-top:1px solid var(--line)}.composer input{flex:1;border:1px solid var(--line);border-radius:11px;padding:11px}
    .flow-canvas{display:grid;grid-template-columns:1fr 320px;background:#f7f8fc;border:1px solid var(--line);border-radius:16px;min-height:610px;overflow:hidden}.canvas{padding:24px;position:relative}.flow-column{display:grid;gap:20px;max-width:560px;margin:auto}.flow-card{background:#fff;border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:14px;padding:15px;box-shadow:var(--shadow)}.flow-card.llm{border-left-color:var(--purple)}.flow-card.output{border-left-color:var(--green)}.flow-card-head{display:flex;justify-content:space-between}.connector{text-align:center;color:#a3acc0;font-size:20px}.node-config{background:#fff;border-left:1px solid var(--line);padding:18px}.node-config h3{margin-top:0}.var{font-family:monospace;background:#eef1ff;color:var(--brand);padding:5px 7px;border-radius:6px;font-size:11px}
    .wizard-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:0 0 18px}.wizard-step{padding:10px;border-bottom:3px solid #e2e6ee;color:var(--muted);font-size:12px}.wizard-step.active{color:var(--brand);border-color:var(--brand)}.option-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.option-card{border:1px solid var(--line);border-radius:12px;padding:13px}.option-card.selected{border-color:var(--brand);background:#f3f5ff}.insights{display:grid;gap:10px}.insight{border-left:4px solid var(--orange);background:#fff8ee;padding:12px;border-radius:9px}.insight.good{border-color:var(--green);background:#effaf6}.insight.risk{border-color:var(--red);background:#fff0f2}.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.kpi{padding:13px;background:#f7f8fc;border-radius:11px}.kpi b{font-size:19px;display:block}.dialog.wide{width:min(900px,94vw);max-height:88vh;overflow:auto}.muted{color:var(--muted)}.section-title{font-size:13px;color:#4e5870;margin:18px 0 10px}.template-preview{display:flex;gap:5px;flex-wrap:wrap}.template-preview span{font-size:11px;padding:4px 7px;border-radius:6px;background:#eef1f7}.action-link{border:0;background:transparent;color:var(--brand);padding:3px}
    @media(max-width:1100px){.stats{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:repeat(2,1fr)}.feature-strip{grid-template-columns:repeat(2,1fr)}.kpi-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.app{grid-template-columns:1fr}aside{position:static;height:auto}.nav{grid-template-columns:repeat(3,1fr)}.nav button{justify-content:center}.nav button span:last-child{display:none}.profile,.nav-label{display:none}.topbar{position:static}.grid-2,.cockpit,.workspace,.chat-layout,.flow-canvas{grid-template-columns:1fr}.workspace-side,.chat-side,.node-config{border:0;border-bottom:1px solid var(--line)}.stats,.cards,.feature-strip,.kpi-grid{grid-template-columns:1fr}.content{padding:16px}.form-row{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="app">
  <aside>
    <div class="logo"><div class="logo-mark">M</div><span>经营体管理平台</span></div>
    <div class="nav-label">工作台</div>
    <nav class="nav" id="nav"></nav>
    <div class="profile"><strong>用户22</strong><span>经营管理员 · 在线</span></div>
  </aside>
  <main>
    <header class="topbar"><div class="crumb" id="crumb">首页</div><div class="top-actions"><button id="refresh">↻ 刷新</button><button>CN 中文</button><button>● 用户22</button></div></header>
    <div class="content" id="content"></div>
  </main>
</div>
<div class="modal" id="modal"><div class="dialog"><h2 id="modalTitle">新建</h2><form id="entityForm" class="form-grid"></form><div class="dialog-actions"><button class="btn" data-close>取消</button><button class="btn primary" id="saveEntity">保存</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
const pages=[
  ['home','⌂','首页'],['tables','▦','多维表格'],['templates','◫','模板管理'],['knowledge','◇','知识库'],
  ['documents','▤','文档管理'],['agents','✦','智能体管理'],['chats','◌','对话管理'],['flows','⌘','数据分析智能体'],['cockpit','◉','经营分析']
];
const seed={
  tables:[['销售执行AI助手','销售管理','3','我','今天'],['出货回款','财务协同','16','我','今天'],['销售订单','营销板块','28','我','昨天'],['设备TPM助手','设备板块','5','我','07-24'],['AI董事长助手','经营分析','3','我','07-23']],
  templates:[['销售日报模板','营销板块','12','326','2026-07-24'],['设备点检模板','设备板块','18','89','2026-07-22'],['月度经营复盘','财务板块','25','12','2026-07-18']],
  knowledge:[['公司制度知识库','结构感知（按标题分块）','1','5','启用'],['注塑机维修保养手册','结构感知（按标题分块）','1','4','启用'],['金蓝盟企业相关','结构感知（按标题分块）','1','21','启用'],['商城技术知识库','语义（按相似度分块）','1','11','启用']],
  documents:[['测试-企业综合行政管理制度.docx','docx','17.9 KB','公司制度知识库','已索引','5'],['商城升级关键设计文档.docx','docx','2.3 MB','商城技术知识库','已索引','11'],['注塑机维修保养手册.docx','docx','28.7 KB','注塑机维修保养手册','已索引','4'],['金蓝盟公司介绍.md','md','15.4 KB','金蓝盟企业相关','已索引','21']],
  agents:[['制度AI问答助手','deepseek-v4-pro','0.30','公司制度知识库','启用'],['商城测试','glm-5.2','0.30','商城技术知识库','启用'],['注塑机维修保养','glm-5.2','0.30','注塑机维修保养手册','启用'],['金蓝盟知识库助手','glm-5.2','0.70','金蓝盟企业相关','启用']],
  chats:[['注塑机手册无排产信息','注塑机维修保养','2026-07-25 14:53','正常'],['注塑机油温过高故障排查','注塑机维修保养','2026-07-25 14:29','正常'],['公司各项违规罚款项汇总','制度AI问答助手','2026-07-25 14:27','置顶'],['企业成本核算查询','经营汇总分析助手','2026-07-25 14:03','正常']],
  flows:[['测试销售小程序分析','输入销售数据 → 聚合 → AI报告','PC / 小程序','3'],['设备台账分析','设备台账 → 指标计算 → 异常洞察','PC / 小程序','3'],['简单MD分析师','输入主题 → LLM → Markdown','PC / 小程序','3'],['经营汇总分析助手','多维数据 → 统计 → AI报告 → 文件链接','PC / 小程序','4']]
};
const store=JSON.parse(localStorage.getItem('op-unit-data')||'null')||seed;
const persist=()=>localStorage.setItem('op-unit-data',JSON.stringify(store));
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const nav=$('#nav');nav.innerHTML=pages.map(([id,icon,name],i)=>`<button data-page="${id}" class="${i?'':'active'}"><span class="icon">${icon}</span><span>${name}</span></button>`).join('');
function table(headers,rows,actions=true){return `<div class="table-wrap"><table class="data-table"><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}${actions?'<th>操作</th>':''}</tr></thead><tbody>${rows.map((r,i)=>`<tr>${r.map((x,j)=>`<td>${j===r.length-1&&/启用|索引|正常|置顶|小程序/.test(x)?`<span class="badge ${x==='置顶'?'orange':''}">${esc(x)}</span>`:esc(x)}</td>`).join('')}${actions?`<td><button class="btn sm" onclick="toast('已打开详情')">详情</button> <button class="btn sm" onclick="toast('编辑功能已就绪')">编辑</button> <button class="btn sm danger" onclick="removeRow('${currentPage}',${i})">删除</button></td>`:''}</tr>`).join('')}</tbody></table></div>`}
const pageHead=(title,desc,button)=>`<div class="page-head"><div><h1>${title}</h1><p>${desc}</p></div>${button?`<button class="btn primary" onclick="openCreate('${button}')">＋ ${button}</button>`:''}</div>`;

function modal(title,html,save='保存',wide=false){
  $('#modalTitle').textContent=title;$('#entityForm').innerHTML=html;$('.dialog').classList.toggle('wide',wide);

}

function flowsPage(){return pageHead('数据分析师管理','通过节点编排构建可发布到 PC 与小程序的分析流程。','新建流程')+featureStrip('flows')+toolbar('搜索流程名称')+`<div class="cards">${store.flows.map((r,i)=>`<article class="entity"><div class="entity-head"><h3>${r[0]}</h3><span class="badge">PC / 小程序已发布</span></div><p>${r[1]}</p><div class="flow"><span class="node">INPUT</span><span class="arrow">→</span><span class="node">LLM</span><span class="arrow">→</span><span class="node">OUTPUT</span></div><div class="meta" style="margin-top:14px"><span>${r[3]} 个节点</span><span>最近运行成功</span></div><div class="actions" style="margin-top:13px"><button class="btn sm primary" onclick="openFlowBuilder(${i})">编辑流程</button><button class="btn sm" onclick="toast('测试运行已启动')">测试运行</button><button class="btn sm">会话</button></div></article>`).join('')}</div>`}
function openFlowBuilder(i=0){let r=store.flows[i]||['新分析流程','输入 → LLM → 输出','PC','3'];$('#content').innerHTML=`<section class="page active">${pageHead(r[0],r[1])}<div class="toolbar"><button class="btn" onclick="render()">← 返回列表</button><div class="actions"><button class="btn">测试运行</button><button class="btn">发布设置</button><button class="btn primary" onclick="toast('流程已保存')">保存流程</button></div></div><div class="flow-canvas"><div class="canvas"><div class="flow-column"><article class="flow-card"><div class="flow-card-head"><b>INPUT · 数据输入</b><span class="badge blue">多维表格</span></div><p>销售订单、出货回款、财务月报</p><small>每表最大 1000 行 · 输出 tables[]</small></article><div class="connector">↓</div><article class="flow-card llm"><div class="flow-card-head"><b>LLM · 报告生成</b><span class="badge blue">glm-5.2</span></div><p>系统提示词 + 用户提示词 + <span class="var">{{input}}</span></p><small>生成经营趋势、异常和行动建议</small></article><div class="connector">↓</div><article class="flow-card output"><div class="flow-card-head"><b>OUTPUT · 结果输出</b><span class="badge">HTML</span></div><p>上传 RustFS 对象存储并生成预览链接</p></article><button class="btn" onclick="toast('节点库已打开')">＋ 添加节点</button></div></div><aside class="node-config"><h3>节点配置</h3>${select('输入方式',['多维表格','文件上传','手动输入'])}${select('选择表格',['销售订单','出货回款','财务月报'])}${input('每表最大行数','1000','number')}<div class="section-title">可用节点</div>${['输入','脚本处理','LLM','条件分支','格式转换','输出'].map(x=>`<button class="field-type" style="width:48%;margin:1%" onclick="toast('已添加${x}节点')">${x}</button>`).join('')}<div class="section-title">模板变量</div><span class="var">{{input}}</span> <span class="var">{{state.node-1.output}}</span></aside></div></section>`}
function cockpitPage(){let ds=[['销售报表','营销板块','销售数量、回款与客户转化','#'],['经营分析','财务板块','利润、资产与现金流综合分析','green'],['设备TPM驾驶舱','设备板块','OEE、故障、保养和停机洞察','purple'],['销售分析驾驶舱','营销板块','目标达成、趋势与机会预测','orange']];return pageHead('我的 AI 驾驶舱','跨业务板块观察指标、筛选数据并调用 AI 分析。','新建驾驶舱')+`<div class="wizard-steps"><div class="wizard-step active">1 制作驾驶舱</div><div class="wizard-step">2 勾选多维表格</div><div class="wizard-step">3 AI 分析配置</div><div class="wizard-step">4 拖拽仪表</div></div><div class="cockpit-filters">${['全部','营销板块','生产板块','财务板块','人力板块','采购板块','设备板块'].map((x,i)=>`<button class="chip ${i?'':'active'}" onclick="selectChip(this)">${x}</button>`).join('')}</div><div class="cockpit">${ds.map((d,i)=>`<article class="dash"><div class="dash-preview ${d[3]}"><span class="badge">${d[1]}</span><h2>${d[0]}</h2><p>${d[2]}</p><div class="mini-bars">${[38,62,47,88,72,96].map((h,j)=>`<i style="height:${h-(i*3)+(j%2)*5}%"></i>`).join('')}</div></div><div class="dash-foot"><span>发布：2026-07-${25-i}</span><div><button class="btn sm" onclick="openCockpitFilter()">筛选</button> <button class="btn sm primary" onclick="openAiInsight('${d[0]}')">AI 分析</button></div></div></article>`).join('')}</div>`}
function openCockpitWizard(){modal('新建驾驶舱',`<div class="wizard-steps"><div class="wizard-step active">1 基础信息</div><div class="wizard-step">2 数据表</div><div class="wizard-step">3 AI 配置</div><div class="wizard-step">4 仪表布局</div></div><div class="form-section"><div class="form-row">${input('驾驶舱名称','营销经营分析驾驶舱')}${select('所属板块',['营销板块','生产板块','财务板块','设备板块'])}</div>${input('描述','','text','驾驶舱用途说明')}</div><div class="option-cards"><div class="option-card selected"><b>已选数据表（3）</b><p>销售订单、出货回款、客户台账</p></div><div class="option-card"><b>AI 分析助手</b><p>经营汇总分析助手 · 自动生成洞察</p></div><div class="option-card"><b>仪表组件</b><p>指标卡、趋势图、结构图、明细表</p></div><div class="option-card"><b>发布范围</b><p>经营层可见 · 每日自动刷新</p></div></div>`,'下一步',true)}
function openCockpitFilter(){modal('驾驶舱筛选',`<div class="form-row">${select('统计周期',['本月','本季度','本年度','自定义'])}${select('经营体',['全部经营体','营销经营体','制造经营体'])}${select('区域',['全部区域','华东','华南','华北'])}${select('数据口径',['含税','不含税'])}</div>`,'应用筛选')}
function openAiInsight(name){modal(name+' · AI 经营洞察',`<div class="kpi-grid"><div class="kpi"><b>¥2,846万</b><small>本月营收 ↑12.6%</small></div><div class="kpi"><b>18.4%</b><small>毛利率 ↑1.8pp</small></div><div class="kpi"><b>76.2%</b><small>回款达成率</small></div><div class="kpi"><b>3 项</b><small>需要关注</small></div></div><div class="insights"><div class="insight good"><b>增长亮点</b><p>华东区域销售额同比增长 23%，主要来自设备升级项目。</p></div><div class="insight risk"><b>风险预警</b><p>逾期 30 天以上应收款增加 18%，集中在 3 个重点客户。</p></div><div class="insight"><b>行动建议</b><p>本周优先推进 3 个逾期客户回款；复制华东区域的解决方案销售打法。</p></div></div><small class="muted">依据：销售订单 326 条、出货回款 168 条 · 分析时间 11:28</small>`,'导出报告',true)}
let currentPage='home';
function render(){let html={home:home(),tables:tablesPage(),templates:templatesPage(),knowledge:knowledgePage(),documents:documentsPage(),agents:agentsPage(),chats:chatsPage(),flows:flowsPage(),cockpit:cockpitPage()}[currentPage];$('#content').innerHTML=`<section class="page active">${html}</section>`;$('#crumb').textContent=pages.find(x=>x[0]===currentPage)[2]}
function activateNav(){nav.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x.dataset.page===currentPage))}
nav.addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(!b)return;currentPage=b.dataset.page;activateNav();render()});
$('#refresh').onclick=()=>{render();toast('数据已刷新')};
function openCreate(){({tables:openTableWizard,templates:()=>modal('导入模板',`<div class="dropzone"><b>上传模板文件</b><span>支持系统导出的 JSON 模板包</span></div>`,'导入'),knowledge:()=>openKnowledgeConfig(),documents:openDocumentUpload,agents:()=>openAgentConfig(),chats:()=>toast('已创建空白会话'),flows:()=>openFlowBuilder(0),cockpit:openCockpitWizard}[currentPage]||openTableWizard)()}
document.querySelector('[data-close]').onclick=()=>$('#modal').classList.remove('open');
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('open')});
function removeRow(type,i){if(!store[type])return;store[type].splice(i,1);persist();render();toast('记录已删除')}
function searchRows(){let q=$('.search')?.value.trim();if(!q){toast('请输入搜索关键词');return}document.querySelectorAll('.data-table tbody tr,.entity').forEach(el=>el.style.display=el.textContent.includes(q)?'':'none');toast('筛选完成')}
function selectChip(el){document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));el.classList.add('active');toast(`已切换到${el.textContent}`)}
function toast(msg){let t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(()=>t.classList.remove('show'),1800)}
render();
</script>
</body>
</html>
